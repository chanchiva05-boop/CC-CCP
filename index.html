<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>អានសៀវភៅ CC & CCP</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600;700&display=swap" rel="stylesheet"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans Khmer', sans-serif;
            background: #eef1f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 30px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .header i {
            font-size: 28px;
            color: #2c3e50;
            background: #ecf0f1;
            padding: 12px;
            border-radius: 12px;
        }

        .header h1 {
            font-size: 22px;
            color: #2c3e50;
        }

        .header span {
            font-size: 13px;
            color: #7f8c8d;
            margin-left: auto;
            background: #eaf2f8;
            padding: 4px 14px;
            border-radius: 20px;
        }

        .canvas-wrapper {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 8px;
            border: 1px solid #e9ecef;
        }

        #pdf-canvas {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .controls button {
            padding: 10px 22px;
            border: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            background: #ecf0f1;
            color: #2c3e50;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .controls button:hover:not(:disabled) {
            background: #d5dbdf;
        }

        .controls button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .controls .btn-primary {
            background: #2c3e50;
            color: #fff;
        }

        .controls .btn-primary:hover:not(:disabled) {
            background: #1a252f;
        }

        .search-group {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f8f9fa;
            padding: 4px 6px 4px 14px;
            border-radius: 30px;
            border: 1px solid #e9ecef;
        }

        .search-group i {
            color: #95a5a6;
            font-size: 14px;
        }

        .search-group input {
            width: 50px;
            padding: 7px 4px;
            border: 1px solid #dce0e5;
            border-radius: 20px;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            outline: none;
            background: #fff;
        }

        .search-group input:focus {
            border-color: #2c3e50;
        }

        .search-group input::-webkit-inner-spin-button {
            -webkit-appearance: none;
        }
        .search-group input[type="number"] {
            -moz-appearance: textfield;
        }

        .search-group .total {
            color: #7f8c8d;
            font-weight: 500;
            font-size: 14px;
        }

        .search-group .go-btn {
            padding: 7px 14px;
            background: #2c3e50;
            color: #fff;
            border: none;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            transition: 0.2s;
        }

        .search-group .go-btn:hover {
            background: #1a252f;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid #e9ecef;
            flex-wrap: wrap;
            gap: 8px;
        }

        .footer .warning {
            color: #e74c3c;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .footer .info {
            font-size: 12px;
            color: #95a5a6;
            display: flex;
            gap: 12px;
        }

        .footer .info span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #2c3e50;
            color: #fff;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Noto Sans Khmer', sans-serif;
            opacity: 0;
            transition: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast i {
            font-size: 18px;
        }

        @media (max-width: 640px) {
            .container { padding: 16px; }
            .controls { flex-direction: column; }
            .controls button { width: 100%; justify-content: center; }
            .search-group { width: 100%; justify-content: center; }
            .footer { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

<div class="toast" id="toast">
    <i class="fas fa-info-circle"></i>
    <span id="toast-msg"></span>
</div>

<div class="container">

    <div class="header">
        <i class="fas fa-book"></i>
        <h1>CC & CCP</h1>
        <span><i class="fas fa-eye"></i> អានតែប៉ុណ្ណោះ</span>
    </div>

    <div class="canvas-wrapper">
        <canvas id="pdf-canvas"></canvas>
    </div>

    <div class="controls">
        <button id="prev-btn"><i class="fas fa-chevron-left"></i> មុន</button>

        <div class="search-group">
            <i class="fas fa-search"></i>
            <input type="number" id="page-input" min="1" value="1" />
            <span class="total">/ <span id="total-pages">1</span></span>
            <button class="go-btn" id="go-btn"><i class="fas fa-arrow-right"></i></button>
        </div>

        <button id="next-btn" class="btn-primary">បន្ទាប់ <i class="fas fa-chevron-right"></i></button>
    </div>

    <div class="footer">
        <div class="warning">
            <i class="fas fa-ban"></i> ហាមចម្លង · បោះពុម្ព · ទាញយក
        </div>
        <div class="info">
            <span><i class="fas fa-lock" style="color:#27ae60;"></i> ការពារ</span>
            <span><i class="fas fa-print" style="color:#e74c3c;"></i> បិទ Print</span>
        </div>
    </div>
</div>

<script>
    (function() {
        const PDF_URL = 'CC&CCP.pdf';
        const OFFSET = 5;

        const canvas = document.getElementById('pdf-canvas');
        const ctx = canvas.getContext('2d');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const pageInput = document.getElementById('page-input');
        const goBtn = document.getElementById('go-btn');
        const totalPagesSpan = document.getElementById('total-pages');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-msg');

        let pdfDoc = null;
        let currentPage = 1;
        let totalPages = 0;
        let toastTimeout = null;

        function showToast(msg, type = 'info') {
            if (toastTimeout) clearTimeout(toastTimeout);
            toastMsg.textContent = msg;
            toast.className = 'toast show';
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && (e.key === 'p' || e.key === 's')) {
                e.preventDefault();
                showToast('⛔ មុខងារនេះត្រូវបានបិទ');
                return false;
            }
        });

        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            showToast('⛔ មុខងារចុចស្ដាំត្រូវបានបិទ');
        });

        document.addEventListener('dragstart', function(e) {
            e.preventDefault();
        });

        document.addEventListener('copy', function(e) {
            e.preventDefault();
            showToast('⛔ ការចម្លងមិនត្រូវបានអនុញ្ញាត');
        });

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        function renderPage(pageNum) {
            if (!pdfDoc) return;
            pdfDoc.getPage(pageNum).then(function(page) {
                const viewport = page.getViewport({ scale: 1.6 });
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                return page.render({ canvasContext: ctx, viewport: viewport }).promise;
            }).then(function() {
                pageInput.value = currentPage;
                prevBtn.disabled = currentPage === 1;
                nextBtn.disabled = currentPage === totalPages;
            }).catch(function() {
                showToast('មិនអាចបង្ហាញទំព័រនេះបានទេ');
            });
        }

        pdfjsLib.getDocument(PDF_URL).promise.then(function(doc) {
            pdfDoc = doc;
            totalPages = doc.numPages;
            totalPagesSpan.textContent = totalPages;
            pageInput.max = totalPages;
            currentPage = 1;
            renderPage(currentPage);
        }).catch(function() {
            showToast('មិនអាចផ្ទុកឯកសារ PDF បានទេ');
        });

        function goToPage() {
            if (!pdfDoc) return;
            let val = parseInt(pageInput.value);
            if (isNaN(val) || val < 1) val = 1;
            if (val > totalPages) val = totalPages;

            let target = val + OFFSET;
            if (target > totalPages) target = totalPages;

            if (target === currentPage) {
                showToast(`កំពុងនៅទំព័រ ${target} រួចហើយ`);
                return;
            }

            currentPage = target;
            renderPage(currentPage);
            showToast(`ទៅទំព័រ ${currentPage} (${val} +${OFFSET})`);
        }

        goBtn.addEventListener('click', goToPage);

        pageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                goToPage();
            }
        });

        prevBtn.addEventListener('click', function() {
            if (currentPage > 1) {
                currentPage--;
                renderPage(currentPage);
            }
        });

        nextBtn.addEventListener('click', function() {
            if (currentPage < totalPages) {
                currentPage++;
                renderPage(currentPage);
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.target.tagName === 'INPUT') return;
            if (e.key === 'ArrowLeft' && currentPage > 1) {
                e.preventDefault();
                currentPage--;
                renderPage(currentPage);
            } else if (e.key === 'ArrowRight' && currentPage < totalPages) {
                e.preventDefault();
                currentPage++;
                renderPage(currentPage);
            }
        });

    })();
</script>
</body>
</html>
