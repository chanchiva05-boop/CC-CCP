<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SpeedTest Pro</title>
<meta name="description" content="សាកល្បងល្បឿន Internet យ៉ាងត្រឹមត្រូវ">
<meta name="theme-color" content="#06060c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SpeedTest">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #06060c;
    --surface: rgba(255, 255, 255, 0.025);
    --surface-hi: rgba(255, 255, 255, 0.05);
    --border: rgba(255, 255, 255, 0.06);
    --border-hi: rgba(255, 255, 255, 0.12);
    --text: #ffffff;
    --text-dim: rgba(255, 255, 255, 0.45);
    --text-mid: rgba(255, 255, 255, 0.7);
    --cyan: #22d3ee;
    --violet: #a855f7;
    --pink: #f472b6;
    --lime: #a3e635;
    --orange: #fb923c;
    --red: #f87171;
    --green: #4ade80;
  }

  html, body { height: 100%; }

  body {
    font-family: 'Space Grotesk', 'Kantumruy Pro', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px 16px;
    overflow-x: hidden;
    position: relative;
    font-feature-settings: 'ss01', 'ss02';
  }

  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.5;
    pointer-events: none;
    z-index: 0;
    will-change: transform;
  }

  .orb-1 {
    width: 500px; height: 500px;
    background: radial-gradient(circle, #22d3ee, transparent 70%);
    top: -200px; left: -150px;
    animation: drift1 25s ease-in-out infinite;
  }

  .orb-2 {
    width: 450px; height: 450px;
    background: radial-gradient(circle, #a855f7, transparent 70%);
    bottom: -180px; right: -150px;
    animation: drift2 30s ease-in-out infinite;
  }

  .orb-3 {
    width: 350px; height: 350px;
    background: radial-gradient(circle, #f472b6, transparent 70%);
    top: 40%; left: 60%;
    opacity: 0.25;
    animation: drift3 35s ease-in-out infinite;
  }

  @keyframes drift1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(80px, 60px) scale(1.15); }
  }
  @keyframes drift2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-70px, -80px) scale(1.1); }
  }
  @keyframes drift3 {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-45%, -55%) scale(1.2); }
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E");
    opacity: 0.025;
    pointer-events: none;
    z-index: 1;
    mix-blend-mode: overlay;
  }

  .app {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 460px;
    background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.015));
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 22px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.06) inset,
      0 40px 100px -20px rgba(0,0,0,0.7),
      0 0 0 1px rgba(255,255,255,0.02);
    animation: enter 0.9s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes enter {
    from { opacity: 0; transform: translateY(24px) scale(0.97); filter: blur(8px); }
    to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 6px 20px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 11px;
  }

  .logo-mark {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--cyan) 0%, var(--violet) 50%, var(--pink) 100%);
    display: grid;
    place-items: center;
    position: relative;
    overflow: hidden;
    box-shadow:
      0 8px 24px -6px rgba(34, 211, 238, 0.5),
      0 0 0 1px rgba(255,255,255,0.1) inset;
  }

  .logo-mark::before {
    content: '';
    position: absolute;
    inset: 1px;
    border-radius: 11px;
    background: linear-gradient(180deg, rgba(255,255,255,0.25), transparent 40%);
    pointer-events: none;
    z-index: 2;
  }

  .logo-mark img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 12px;
    z-index: 1;
  }

  .logo-text {
    display: flex;
    flex-direction: column;
    line-height: 1.15;
  }

  .logo-text strong {
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .logo-text span {
    font-size: 0.65rem;
    color: var(--text-dim);
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .live-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px 6px 8px;
    font-size: 0.68rem;
    font-weight: 600;
    color: var(--text-mid);
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 100px;
    letter-spacing: 0.02em;
  }

  .live-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7);
    animation: ping 2s ease-in-out infinite;
  }

  @keyframes ping {
    0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.6); }
    70% { box-shadow: 0 0 0 8px rgba(74, 222, 128, 0); }
    100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
  }

  .connection {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: 16px;
    margin-bottom: 22px;
    transition: all 0.3s;
  }

  .connection:hover {
    background: rgba(255,255,255,0.035);
    border-color: var(--border-hi);
  }

  .conn-icon {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, rgba(34,211,238,0.15), rgba(168,85,247,0.15));
    border: 1px solid rgba(34,211,238,0.2);
    display: grid;
    place-items: center;
    color: var(--cyan);
  }

  .conn-icon svg { width: 16px; height: 16px; }

  .conn-text {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .conn-label {
    font-size: 0.62rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .conn-value {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .hero {
    position: relative;
    display: flex;
    justify-content: center;
    padding: 8px 0 26px;
  }

  .gauge-box {
    position: relative;
    width: 280px;
    height: 280px;
  }

  .gauge-box::before {
    content: '';
    position: absolute;
    inset: 15%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(34,211,238,0.18), transparent 65%);
    filter: blur(30px);
    opacity: 0.7;
    transition: opacity 0.5s;
  }

  .gauge-box.testing::before {
    opacity: 1;
    animation: breathe 2s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.08); opacity: 1; }
  }

  .gauge-svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
    position: relative;
    z-index: 1;
  }

  .gauge-svg circle { fill: none; }

  .ring-track {
    stroke: rgba(255,255,255,0.05);
    stroke-width: 8;
  }

  .ring-ticks {
    stroke: rgba(255,255,255,0.12);
    stroke-width: 1.5;
  }

  .ring-progress-glow {
    stroke: url(#gaugeGrad);
    stroke-width: 18;
    stroke-linecap: round;
    opacity: 0.35;
    filter: blur(10px);
    transition: stroke-dashoffset 0.28s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .ring-progress {
    stroke: url(#gaugeGrad);
    stroke-width: 8;
    stroke-linecap: round;
    filter: drop-shadow(0 0 10px var(--cyan));
    transition: stroke-dashoffset 0.28s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .display {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 2;
    width: 100%;
    pointer-events: none;
  }

  .display-value {
    font-size: 4.5rem;
    font-weight: 600;
    line-height: 0.95;
    letter-spacing: -0.045em;
    font-variant-numeric: tabular-nums;
    color: #fff;
    text-shadow: 0 0 40px rgba(34, 211, 238, 0.35);
    transition: text-shadow 0.4s;
  }

  .display-value.testing {
    color: #fff;
    text-shadow: 0 0 60px currentColor;
  }

  .display-unit {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-top: 8px;
  }

  .display-phase {
    margin-top: 14px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .phase-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 12px;
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    border-radius: 100px;
    background: rgba(168, 85, 247, 0.12);
    border: 1px solid rgba(168, 85, 247, 0.28);
    color: #e9d5ff;
    opacity: 0;
    transform: scale(0.9);
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .phase-pill.show {
    opacity: 1;
    transform: scale(1);
  }

  .phase-pill.done {
    background: rgba(74, 222, 128, 0.12);
    border-color: rgba(74, 222, 128, 0.3);
    color: #bbf7d0;
  }

  .phase-pill::before {
    content: '';
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 6px currentColor;
    animation: blink 1.2s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }

  .metric {
    position: relative;
    padding: 16px 12px 14px;
    background: rgba(255,255,255,0.025);
    border: 1px solid var(--border);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
  }

  .metric::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(34,211,238,0.08), transparent 60%);
    opacity: 0;
    transition: opacity 0.35s;
    pointer-events: none;
  }

  .metric.active {
    border-color: rgba(34, 211, 238, 0.35);
    background: rgba(34, 211, 238, 0.04);
    transform: translateY(-3px);
    box-shadow:
      0 12px 30px -10px rgba(34, 211, 238, 0.3),
      0 0 0 1px rgba(34,211,238,0.1) inset;
  }

  .metric.active::before { opacity: 1; }

  .metric.complete {
    border-color: rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.035);
  }

  .metric-head {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .metric-icon {
    width: 20px;
    height: 20px;
    border-radius: 6px;
    display: grid;
    place-items: center;
    background: rgba(255,255,255,0.06);
    color: var(--text-mid);
    flex-shrink: 0;
    transition: all 0.3s;
  }

  .metric-icon svg { width: 11px; height: 11px; }

  .metric.active .metric-icon {
    background: linear-gradient(135deg, var(--cyan), var(--violet));
    color: #fff;
    box-shadow: 0 4px 12px rgba(34,211,238,0.4);
  }

  .metric.complete .metric-icon {
    background: rgba(74, 222, 128, 0.15);
    color: var(--green);
  }

  .metric-name {
    font-size: 0.66rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .metric-value {
    font-size: 1.35rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    line-height: 1;
    display: flex;
    align-items: baseline;
    gap: 3px;
    transition: color 0.3s;
  }

  .metric.complete .metric-value { color: #fff; }

  .metric-unit {
    font-size: 0.62rem;
    font-weight: 500;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }

  .cta {
    width: 100%;
    padding: 0;
    border: none;
    border-radius: 16px;
    background: transparent;
    cursor: pointer;
    position: relative;
    font-family: inherit;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .cta-inner {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 17px 24px;
    border-radius: 16px;
    background: linear-gradient(135deg, #22d3ee 0%, #a855f7 55%, #f472b6 100%);
    background-size: 200% 200%;
    color: #fff;
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    overflow: hidden;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.3) inset,
      0 -8px 20px -8px rgba(0,0,0,0.3) inset,
      0 12px 32px -8px rgba(168, 85, 247, 0.5),
      0 4px 16px -4px rgba(34, 211, 238, 0.4);
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .cta-inner::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,0.35) 50%, transparent 70%);
    transform: translateX(-100%);
    transition: transform 0.8s;
  }

  .cta:hover:not(:disabled) {
    transform: translateY(-2px);
  }

  .cta:hover:not(:disabled) .cta-inner {
    background-position: 100% 50%;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.3) inset,
      0 -8px 20px -8px rgba(0,0,0,0.3) inset,
      0 18px 40px -10px rgba(168, 85, 247, 0.6),
      0 6px 24px -6px rgba(34, 211, 238, 0.5);
  }

  .cta:hover:not(:disabled) .cta-inner::before {
    transform: translateX(100%);
  }

  .cta:active:not(:disabled) {
    transform: translateY(0) scale(0.985);
  }

  .cta:disabled {
    cursor: not-allowed;
  }

  .cta:disabled .cta-inner {
    background: linear-gradient(135deg, rgba(34,211,238,0.3), rgba(168,85,247,0.3));
    box-shadow:
      0 1px 0 rgba(255,255,255,0.1) inset,
      0 8px 24px -8px rgba(168, 85, 247, 0.2);
    color: rgba(255,255,255,0.85);
  }

  .cta-icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  .cta:disabled .cta-icon {
    animation: spin 1.4s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .status {
    margin-top: 14px;
    text-align: center;
    font-size: 0.76rem;
    font-weight: 500;
    color: var(--text-dim);
    letter-spacing: 0.01em;
    min-height: 18px;
    transition: color 0.3s;
  }

  .status.success { color: var(--green); }
  .status.error { color: var(--red); }

  .footer {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    text-align: center;
    font-size: 0.68rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .footer .dev {
    background: linear-gradient(90deg, var(--cyan), var(--violet), var(--pink));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 700;
    letter-spacing: 0.1em;
  }

  .install-btn {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(120px);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 20px;
    background: linear-gradient(135deg, #22d3ee, #a855f7);
    color: #fff;
    border: none;
    border-radius: 100px;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
    z-index: 100;
    box-shadow:
      0 12px 32px -8px rgba(168, 85, 247, 0.6),
      0 4px 16px -4px rgba(34, 211, 238, 0.5);
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s;
  }

  .install-btn.show {
    transform: translateX(-50%) translateY(0);
  }

  .install-btn:hover {
    box-shadow:
      0 18px 40px -10px rgba(168, 85, 247, 0.7),
      0 6px 24px -6px rgba(34, 211, 238, 0.6);
  }

  .install-btn svg {
    width: 16px;
    height: 16px;
  }

  @media (display-mode: standalone) {
    .install-btn { display: none !important; }
  }

  @media (max-width: 440px) {
    .app { padding: 18px; border-radius: 24px; }
    .gauge-box { width: 240px; height: 240px; }
    .display-value { font-size: 3.8rem; }
    .metric-value { font-size: 1.15rem; }
  }

  @media (max-width: 360px) {
    .gauge-box { width: 210px; height: 210px; }
    .display-value { font-size: 3.2rem; }
    .metrics { gap: 8px; }
    .metric { padding: 14px 10px 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <main class="app">

    <header class="header">
      <div class="logo">
        <div class="logo-mark">
          <img src="logo.png" alt="SpeedTest" onerror="this.style.display='none';this.parentNode.innerHTML='<svg viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'#fff\' stroke-width=\'2.4\' stroke-linecap=\'round\' stroke-linejoin=\'round\' style=\'width:20px;height:20px;position:relative;z-index:1\'><path d=\'M13 2 3 14h9l-1 8 10-12h-9l1-8z\'/></svg>'">
        </div>
        <div class="logo-text">
          <strong>SpeedTest</strong>
          <span>Pro Edition</span>
        </div>
      </div>
      <div class="live-pill">
        <span class="live-dot"></span>
        <span>Live</span>
      </div>
    </header>

    <div class="connection">
      <div class="conn-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h.01"/>
          <path d="M8.5 16.5a5 5 0 0 1 7 0"/>
          <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
          <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
        </svg>
      </div>
      <div class="conn-text">
        <span class="conn-label">កំពុងភ្ជាប់តាម</span>
        <span class="conn-value" id="ispText">កំពុងរក server...</span>
      </div>
    </div>

    <section class="hero">
      <div class="gauge-box" id="gaugeBox">
        <svg class="gauge-svg" viewBox="0 0 200 200">
          <defs>
            <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#22d3ee"/>
              <stop offset="50%" stop-color="#a855f7"/>
              <stop offset="100%" stop-color="#f472b6"/>
            </linearGradient>
          </defs>

          <circle class="ring-track" cx="100" cy="100" r="86"/>

          <circle class="ring-ticks" cx="100" cy="100" r="70"
                  stroke-dasharray="1.5 9.15"
                  opacity="0.6"/>

          <circle class="ring-progress-glow" id="progressGlow"
                  cx="100" cy="100" r="86"
                  stroke-dasharray="540.35"
                  stroke-dashoffset="540.35"
                  transform="rotate(-90 100 100)"/>

          <circle class="ring-progress" id="progressArc"
                  cx="100" cy="100" r="86"
                  stroke-dasharray="540.35"
                  stroke-dashoffset="540.35"
                  transform="rotate(-90 100 100)"/>
        </svg>

        <div class="display">
          <div class="display-value" id="speedValue">0</div>
          <div class="display-unit">Mbps</div>
          <div class="display-phase">
            <div class="phase-pill" id="phasePill"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="metrics">
      <div class="metric" id="mDownload">
        <div class="metric-head">
          <div class="metric-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 5v14"/>
              <path d="m19 12-7 7-7-7"/>
            </svg>
          </div>
          <span class="metric-name">Download</span>
        </div>
        <div class="metric-value">
          <span id="downloadValue">--</span>
          <span class="metric-unit">Mbps</span>
        </div>
      </div>

      <div class="metric" id="mUpload">
        <div class="metric-head">
          <div class="metric-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19V5"/>
              <path d="m5 12 7-7 7 7"/>
            </svg>
          </div>
          <span class="metric-name">Upload</span>
        </div>
        <div class="metric-value">
          <span id="uploadValue">--</span>
          <span class="metric-unit">Mbps</span>
        </div>
      </div>

      <div class="metric" id="mPing">
        <div class="metric-head">
          <div class="metric-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
            </svg>
          </div>
          <span class="metric-name">Ping</span>
        </div>
        <div class="metric-value">
          <span id="pingValue">--</span>
          <span class="metric-unit">ms</span>
        </div>
      </div>
    </section>

    <button class="cta" id="startBtn">
      <span class="cta-inner">
        <svg class="cta-icon" id="ctaIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="6 3 20 12 6 21 6 3" fill="currentColor"/>
        </svg>
        <span id="btnText">ចាប់ផ្តើមសាកល្បង</span>
      </span>
    </button>

    <p class="status" id="status">ចុចប៊ូតុងដើម្បីចាប់ផ្តើម</p>

    <div class="footer">Developed by <span class="dev">Mr.TEVA</span></div>
  </main>

  <button class="install-btn" id="installBtn" aria-label="ដំឡើងកម្មវិធី">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3v12"/>
      <path d="m7 10 5 5 5-5"/>
      <path d="M5 21h14"/>
    </svg>
    <span>ដំឡើងកម្មវិធី</span>
  </button>

<script>
(function () {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const startBtn = $('startBtn');
  const btnText = $('btnText');
  const ctaIcon = $('ctaIcon');
  const statusEl = $('status');
  const speedValue = $('speedValue');
  const phasePill = $('phasePill');
  const downloadValue = $('downloadValue');
  const uploadValue = $('uploadValue');
  const pingValue = $('pingValue');
  const ispText = $('ispText');
  const gaugeBox = $('gaugeBox');
  const progressArc = $('progressArc');
  const progressGlow = $('progressGlow');
  const mDownload = $('mDownload');
  const mUpload = $('mUpload');
  const mPing = $('mPing');

  const CIRC = 2 * Math.PI * 86;
  const MAX_GAUGE = 500;

  progressArc.setAttribute('stroke-dasharray', CIRC);
  progressGlow.setAttribute('stroke-dasharray', CIRC);
  progressArc.setAttribute('stroke-dashoffset', CIRC);
  progressGlow.setAttribute('stroke-dashoffset', CIRC);

  function setGauge(speed) {
    const pct = Math.min(Math.log10(Math.max(speed, 1)) / Math.log10(MAX_GAUGE), 1);
    const offset = CIRC * (1 - pct);
    progressArc.style.strokeDashoffset = offset;
    progressGlow.style.strokeDashoffset = offset;

    let color = '#f87171';
    if (speed >= 200) color = '#a3e635';
    else if (speed >= 100) color = '#4ade80';
    else if (speed >= 50) color = '#22d3ee';
    else if (speed >= 20) color = '#60a5fa';
    else if (speed >= 5) color = '#fb923c';

    progressArc.style.filter = 'drop-shadow(0 0 12px ' + color + ')';
    speedValue.style.textShadow = '0 0 60px ' + color;

    speedValue.textContent = speed < 10 ? speed.toFixed(2) : speed < 100 ? speed.toFixed(1) : speed.toFixed(0);
  }

  function resetGauge() {
    speedValue.textContent = '0';
    speedValue.classList.remove('testing');
    speedValue.style.textShadow = '0 0 40px rgba(34, 211, 238, 0.35)';
    progressArc.style.strokeDashoffset = CIRC;
    progressGlow.style.strokeDashoffset = CIRC;
    gaugeBox.classList.remove('testing');
    phasePill.classList.remove('show', 'done');
    phasePill.textContent = '';
    [mDownload, mUpload, mPing].forEach(m => m.classList.remove('active', 'complete'));
  }

  function setPhase(text, isDone) {
    phasePill.textContent = text;
    phasePill.classList.add('show');
    phasePill.classList.toggle('done', !!isDone);
    gaugeBox.classList.add('testing');
    speedValue.classList.add('testing');
  }

  function activateMetric(el) {
    [mDownload, mUpload, mPing].forEach(m => m.classList.remove('active'));
    el.classList.add('active');
  }

  async function testPing() {
    setPhase('Testing Ping');
    activateMetric(mPing);
    statusEl.textContent = 'កំពុងតេស្ត Ping...';
    statusEl.className = 'status';

    const base = 'https://speed.cloudflare.com/__down?bytes=0&t=';
    const samples = [];

    try { await fetch(base + Date.now() + '&w=1', { cache: 'no-store' }); } catch (e) {}

    for (let i = 0; i < 12; i++) {
      const start = performance.now();
      try {
        await fetch(base + Date.now() + '&i=' + i, { cache: 'no-store' });
        samples.push(performance.now() - start);
      } catch (e) {}
      await new Promise(r => setTimeout(r, 30));
    }

    if (!samples.length) return { ping: 0, jitter: 0 };

    samples.sort((a, b) => a - b);
    const fastest = samples.slice(0, Math.max(1, Math.floor(samples.length * 0.3)));
    const ping = fastest.reduce((a, b) => a + b, 0) / fastest.length;

    let jitterSum = 0;
    for (let i = 1; i < samples.length; i++) {
      jitterSum += Math.abs(samples[i] - samples[i - 1]);
    }
    const jitter = jitterSum / (samples.length - 1);

    pingValue.textContent = ping.toFixed(0);
    mPing.classList.remove('active');
    mPing.classList.add('complete');
    return { ping, jitter };
  }

  async function testDownload() {
    setPhase('Testing Download');
    activateMetric(mDownload);
    statusEl.textContent = 'កំពុងតេស្តល្បឿន Download...';

    speedValue.classList.add('testing');
    progressArc.style.strokeDashoffset = CIRC;
    progressGlow.style.strokeDashoffset = CIRC;

    const STREAMS = 6;
    const DURATION = 8000;
    const CHUNK = 25 * 1024 * 1024;

    let totalBytes = 0;
    let active = true;
    const speeds = [];

    const startTime = performance.now();
    let lastTime = startTime;
    let lastBytes = 0;
    let smoothSpeed = 0;

    const tracker = setInterval(() => {
      const now = performance.now();
      const dt = (now - lastTime) / 1000;
      const dBytes = totalBytes - lastBytes;

      if (dt > 0) {
        const instant = (dBytes * 8) / dt / 1e6;
        if (instant > 0) {
          smoothSpeed = smoothSpeed === 0 ? instant : smoothSpeed * 0.7 + instant * 0.3;
          speeds.push(smoothSpeed);
          setGauge(smoothSpeed);
        }
      }
      lastTime = now;
      lastBytes = totalBytes;
    }, 150);

    async function worker() {
      while (active && (performance.now() - startTime) < DURATION) {
        try {
          const res = await fetch(
            'https://speed.cloudflare.com/__down?bytes=' + CHUNK + '&t=' + Date.now() + Math.random(),
            { cache: 'no-store' }
          );
          const reader = res.body.getReader();
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            totalBytes += value.length;
            if (performance.now() - startTime > DURATION) {
              active = false;
              try { reader.cancel(); } catch (e) {}
              break;
            }
          }
        } catch (e) {
          await new Promise(r => setTimeout(r, 100));
        }
      }
    }

    await Promise.all(Array.from({ length: STREAMS }, () => worker()));
    active = false;
    clearInterval(tracker);

    const elapsed = (performance.now() - startTime) / 1000;
    const avg = (totalBytes * 8) / elapsed / 1e6;

    speeds.sort((a, b) => b - a);
    const topCount = Math.max(1, Math.floor(speeds.length * 0.25));
    const topAvg = speeds.slice(0, topCount).reduce((a, b) => a + b, 0) / topCount;

    const final = Math.max(avg, topAvg * 0.95);

    downloadValue.textContent = final.toFixed(1);
    mDownload.classList.remove('active');
    mDownload.classList.add('complete');
    setGauge(final);
    return final;
  }

  async function testUpload() {
    setPhase('Testing Upload');
    activateMetric(mUpload);
    statusEl.textContent = 'កំពុងតេស្តល្បឿន Upload...';

    speedValue.classList.add('testing');
    progressArc.style.strokeDashoffset = CIRC;
    progressGlow.style.strokeDashoffset = CIRC;

    const STREAMS = 6;
    const DURATION = 8000;
    const SIZE = 1 * 1024 * 1024;

    const chunk = new Uint8Array(SIZE);
    crypto.getRandomValues(chunk.subarray(0, 65536));
    for (let i = 65536; i < SIZE; i += 65536) {
      chunk.set(chunk.subarray(0, Math.min(65536, SIZE - i)), i);
    }
    const blob = new Blob([chunk]);

    let totalBytes = 0;
    let active = true;
    const speeds = [];
    const pending = new Set();

    const startTime = performance.now();
    let lastTime = startTime;
    let lastBytes = 0;
    let smoothSpeed = 0;

    const tracker = setInterval(() => {
      const now = performance.now();
      const dt = (now - lastTime) / 1000;
      const dBytes = totalBytes - lastBytes;

      if (dt > 0) {
        const instant = (dBytes * 8) / dt / 1e6;
        if (instant > 0) {
          smoothSpeed = smoothSpeed === 0 ? instant : smoothSpeed * 0.7 + instant * 0.3;
          speeds.push(smoothSpeed);
          setGauge(smoothSpeed);
        }
      }
      lastTime = now;
      lastBytes = totalBytes;
    }, 150);

    function uploadOnce() {
      return new Promise((resolve) => {
        const xhr = new XMLHttpRequest();
        let last = 0;
        let settled = false;

        const finish = () => {
          if (settled) return;
          settled = true;
          pending.delete(xhr);
          resolve();
        };

        xhr.open('POST', 'https://speed.cloudflare.com/__up?t=' + Date.now() + Math.random(), true);
        xhr.upload.onprogress = (e) => {
          if (!e.lengthComputable) return;
          const delta = e.loaded - last;
          last = e.loaded;
          if (delta > 0) totalBytes += delta;
        };

        xhr.onloadend = finish;
        xhr.onerror = finish;
        xhr.onabort = finish;
        xhr.ontimeout = finish;

        pending.add(xhr);

        try {
          xhr.send(blob);
        } catch (e) {
          finish();
        }
      });
    }

    async function worker() {
      while (active && (performance.now() - startTime) < DURATION) {
        try {
          await uploadOnce();
        } catch (e) {
          await new Promise(r => setTimeout(r, 50));
        }
      }
    }

    const timeoutCheck = setInterval(() => {
      if (performance.now() - startTime > DURATION) {
        active = false;
        pending.forEach((xhr) => {
          try { xhr.abort(); } catch (e) {}
        });
        pending.clear();
      }
    }, 200);

    await Promise.all(Array.from({ length: STREAMS }, () => worker()));

    active = false;
    clearInterval(tracker);
    clearInterval(timeoutCheck);

    const elapsed = (performance.now() - startTime) / 1000;
    const avg = (totalBytes * 8) / elapsed / 1e6;

    speeds.sort((a, b) => b - a);
    const topCount = Math.max(1, Math.floor(speeds.length * 0.3));
    const topAvg = speeds.slice(0, topCount).reduce((a, b) => a + b, 0) / topCount;

    const final = Math.max(avg, topAvg * 0.9);

    uploadValue.textContent = final.toFixed(1);
    mUpload.classList.remove('active');
    mUpload.classList.add('complete');
    setGauge(final);
    return final;
  }

  async function loadInfo() {
    try {
      const res = await fetch('https://speed.cloudflare.com/meta');
      const d = await res.json();
      const isp = d.asOrganization || d.asn || 'Unknown ISP';
      const city = d.city || '';
      const country = d.country || '';
      const loc = [city, country].filter(Boolean).join(', ');
      ispText.textContent = isp + (loc ? ' • ' + loc : '');
    } catch (e) {
      ispText.textContent = 'Cloudflare Edge Network';
    }
  }

  startBtn.addEventListener('click', async () => {
    startBtn.disabled = true;
    btnText.textContent = 'កំពុងសាកល្បង...';
    ctaIcon.innerHTML = '<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.5" fill="none" stroke-dasharray="15 40" stroke-linecap="round"/>';

    downloadValue.textContent = '--';
    uploadValue.textContent = '--';
    pingValue.textContent = '--';
    resetGauge();

    try {
      await testPing();
      await testDownload();
      await testUpload();

      setPhase('ការសាកល្បងបានបញ្ចប់', true);
      statusEl.textContent = 'បានបញ្ចប់ដោយជោគជ័យ';
      statusEl.className = 'status success';
      gaugeBox.classList.remove('testing');
      speedValue.classList.remove('testing');
      [mDownload, mUpload, mPing].forEach(m => m.classList.remove('active'));
    } catch (err) {
      console.error(err);
      statusEl.textContent = 'មានបញ្ហា: ' + err.message;
      statusEl.className = 'status error';
      phasePill.classList.remove('show');
      gaugeBox.classList.remove('testing');
    } finally {
      startBtn.disabled = false;
      btnText.textContent = 'សាកល្បងម្តងទៀត';
      ctaIcon.innerHTML = '<polygon points="6 3 20 12 6 21 6 3" fill="currentColor"/>';
    }
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }

  let deferredPrompt = null;
  const installBtn = document.getElementById('installBtn');

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    if (installBtn) installBtn.classList.add('show');
  });

  if (installBtn) {
    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) {
        installBtn.classList.remove('show');
        return;
      }
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.classList.remove('show');
    });
  }

  window.addEventListener('appinstalled', () => {
    deferredPrompt = null;
    if (installBtn) installBtn.classList.remove('show');
  });

  loadInfo();
})();
</script>
</body>
</html>
