<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>អានសៀវភៅ CC & CCP</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=Noto+Sans+Khmer:wght@100..900&display=swap" rel="stylesheet"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans Khmer', 'Inter', sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .reader-card {
            max-width: 1000px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12), 0 8px 24px rgba(0, 0, 0, 0.05);
            padding: 32px 32px 28px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .book-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(145deg, #2c3e50, #1a252f);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f1c40f;
            font-size: 26px;
            box-shadow: 0 6px 16px rgba(44, 62, 80, 0.25);
        }

        .book-title h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a2e;
            letter-spacing: -0.3px;
            line-height: 1.2;
        }

        .book-title .sub {
            font-size: 14px;
            color: #7f8c8d;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
        }

        .book-title .sub i {
            font-size: 12px;
            color: #e67e22;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            background: #eaf2f8;
            color: #2980b9;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .canvas-wrapper {
            background: #f8f9fc;
            border-radius: 18px;
            padding: 12px;
            border: 1px solid #eef0f4;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.02);
            position: relative;
        }

        #pdf-canvas {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
            background: white;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .controls button {
            padding: 12px 24px;
            border: none;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            background: #ecf0f1;
            color: #2c3e50;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .controls button:hover:not(:disabled) {
            background: #d5dbdf;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .controls button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none !important;
        }

        .controls .btn-primary {
            background: #2c3e50;
            color: white;
        }

        .controls .btn-primary:hover:not(:disabled) {
            background: #1a252f;
            box-shadow: 0 8px 24px rgba(44, 62, 80, 0.25);
        }

        .page-control-group {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f8f9fc;
            padding: 4px 6px 4px 16px;
            border-radius: 40px;
            border: 1px solid #e9ebee;
        }

        .page-control-group .page-label {
            font-size: 14px;
            color: #7f8c8d;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .page-control-group .page-label i {
            font-size: 14px;
            color: #95a5a6;
        }

        .page-control-group input {
            width: 56px;
            padding: 8px 4px 8px 10px;
            border: 1px solid #dce0e5;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            color: #2c3e50;
            background: white;
            font-family: inherit;
            outline: none;
            transition: border 0.2s;
        }

        .page-control-group input:focus {
            border-color: #2c3e50;
            box-shadow: 0 0 0 3px rgba(44, 62, 80, 0.1);
        }

        .page-control-group input::-webkit-inner-spin-button {
            -webkit-appearance: none;
        }
        .page-control-group input[type="number"] {
            -moz-appearance: textfield;
        }

        .page-control-group .page-total {
            font-size: 15px;
            font-weight: 500;
            color: #7f8c8d;
            padding-right: 4px;
        }

        .page-control-group .go-btn {
            padding: 8px 16px;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .page-control-group .go-btn:hover {
            background: #1a252f;
        }

        .page-control-group .go-btn i {
            font-size: 13px;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #eef0f4;
            flex-wrap: wrap;
            gap: 10px;
        }

        .protect-note {
            color: #e74c3c;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            background: #fdf2f2;
            padding: 6px 18px 6px 14px;
            border-radius: 30px;
            border: 1px solid #fadbd8;
        }

        .protect-note i {
            font-size: 16px;
        }

        .footer-info {
            font-size: 13px;
            color: #95a5a6;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .footer-info span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #2c3e50;
            color: white;
            padding: 14px 30px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 500;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Noto Sans Khmer', 'Inter', sans-serif;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast i {
            font-size: 20px;
        }
        .toast.warning i { color: #f1c40f; }
        .toast.error i { color: #e74c3c; }
        .toast.success i { color: #2ecc71; }

        @media (max-width: 720px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .controls button {
                justify-content: center;
            }
            .page-control-group {
                justify-content: center;
                padding: 6px 12px;
                flex-wrap: wrap;
            }
            .page-control-group input {
                width: 50px;
            }
        }

        @media (max-width: 640px) {
            body { padding: 12px; }
            .reader-card { padding: 18px 16px 20px; border-radius: 20px; }
            .book-title h1 { font-size: 20px; }
            .header { flex-direction: column; align-items: flex-start; }
            .header-right { width: 100%; justify-content: flex-start; }
            .footer { flex-direction: column; align-items: flex-start; }
            .protect-note { font-size: 13px; }
            .footer-info { font-size: 12px; flex-wrap: wrap; }
            .toast { font-size: 13px; padding: 12px 22px; width: 90%; }
        }
    </style>
</head>
<body>

<div class="toast" id="toast">
    <i class="fas fa-shield-alt"></i>
    <span id="toast-message">មុខងារនេះត្រូវបានបិទ</span>
</div>

<div class="reader-card" id="reader-container">

    <div class="header">
        <div class="header-left">
            <div class="book-icon">
                <i class="fas fa-book-open"></i>
            </div>
            <div class="book-title">
                <h1>CC &amp; CCP</h1>
                <div class="sub">
                    <i class="fas fa-circle" style="color: #27ae60; font-size: 8px;"></i>
                    សៀវភៅអេឡិចត្រូនិច
                    <i class="fas fa-lock" style="color: #e67e22; font-size: 11px; margin-left: 4px;"></i>
                </div>
            </div>
        </div>
        <div class="header-right">
            <div class="badge">
                <i class="fas fa-eye"></i> មើលតែប៉ុណ្ណោះ
            </div>
        </div>
    </div>

    <div class="canvas-wrapper">
        <canvas id="pdf-canvas"></canvas>
    </div>

    <div class="controls">
        <button id="prev-page" disabled>
            <i class="fas fa-chevron-left"></i> មុន
        </button>

        <div class="page-control-group">
            <span class="page-label">
                <i class="fas fa-search"></i> ទំព័រ
            </span>
            <input type="number" id="page-input" min="1" value="1" />
            <span class="page-total">/ <span id="total-pages-display">1</span></span>
            <button class="go-btn" id="go-page-btn">
                <i class="fas fa-arrow-right"></i> ទៅ
            </button>
        </div>

        <button id="next-page" class="btn-primary">
            បន្ទាប់ <i class="fas fa-chevron-right"></i>
        </button>
    </div>

    <div class="footer">
        <div class="protect-note">
            <i class="fas fa-ban"></i>
            ហាមចម្លង · បោះពុម្ព · ទាញយក
        </div>
        <div class="footer-info">
            <span><i class="fas fa-lock" style="color: #27ae60;"></i> ការពារ</span>
            <span><i class="fas fa-print" style="color: #e74c3c;"></i> បិទ Print</span>
            <span><i class="fas fa-download" style="color: #e74c3c;"></i> បិទ Download</span>
        </div>
    </div>
</div>

<script>
    (function() {
        const PDF_URL = 'CC&CCP.pdf';
        const TOAST_DURATION = 2500;

        const canvas = document.getElementById('pdf-canvas');
        const ctx = canvas.getContext('2d');
        const prevBtn = document.getElementById('prev-page');
        const nextBtn = document.getElementById('next-page');
        const pageInput = document.getElementById('page-input');
        const goBtn = document.getElementById('go-page-btn');
        const totalPagesDisplay = document.getElementById('total-pages-display');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-message');

        let pdfDoc = null;
        let currentPage = 1;
        let totalPages = 0;
        let toastTimeout = null;

        function showToast(message, type = 'warning') {
            if (toastTimeout) clearTimeout(toastTimeout);
            toastMsg.textContent = message;
            toast.className = 'toast ' + type;
            void toast.offsetWidth;
            toast.classList.add('show');
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, TOAST_DURATION);
        }

        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'p') {
                e.preventDefault();
                showToast('⛔ ការបោះពុម្ពមិនត្រូវបានអនុញ្ញាត!', 'error');
                return false;
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                showToast('⛔ មិនអាចរក្សាទុកទំព័រនេះបានទេ!', 'error');
                return false;
            }
        });

        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            showToast('⛔ មុខងារចុចស្ដាំត្រូវបានបិទ', 'warning');
        });

        document.addEventListener('dragstart', function(e) {
            e.preventDefault();
            showToast('⛔ មិនអាចអូសឯកសារបានទេ', 'warning');
        });

        document.addEventListener('copy', function(e) {
            e.preventDefault();
            showToast('⛔ ការចម្លងអត្ថបទមិនត្រូវបានអនុញ្ញាត', 'warning');
        });

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        function renderPage(pageNum) {
            if (!pdfDoc) return;
            pdfDoc.getPage(pageNum).then(function(page) {
                const viewport = page.getViewport({ scale: 1.6 });
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };
                return page.render(renderContext).promise;
            }).then(function() {
                pageInput.value = currentPage;
                prevBtn.disabled = (currentPage === 1);
                nextBtn.disabled = (currentPage === totalPages);
            }).catch(function(err) {
                console.error('Render error:', err);
                showToast('មិនអាចបង្ហាញទំព័រនេះបានទេ', 'error');
            });
        }

        pdfjsLib.getDocument(PDF_URL).promise.then(function(doc) {
            pdfDoc = doc;
            totalPages = doc.numPages;
            totalPagesDisplay.textContent = totalPages;
            pageInput.max = totalPages;
            currentPage = 1;
            renderPage(currentPage);
        }).catch(function(err) {
            console.error('Load PDF error:', err);
            showToast('មិនអាចផ្ទុកឯកសារ PDF បានទេ! សូមពិនិត្យផ្លូវឯកសារ។', 'error');
        });

        function goToPage() {
            if (!pdfDoc) return;
            let val = parseInt(pageInput.value);
            if (isNaN(val) || val < 1) val = 1;
            if (val > totalPages) val = totalPages;
            if (val === currentPage) {
                showToast(`អ្នកកំពុងនៅទំព័រ ${val} រួចហើយ`, 'warning');
                return;
            }
            currentPage = val;
            renderPage(currentPage);
            showToast(`📄 បានទៅទំព័រ ${currentPage}`, 'success');
        }

        goBtn.addEventListener('click', goToPage);

        pageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                goToPage();
            }
        });

        prevBtn.addEventListener('click', function() {
            if (currentPage > 1) {
                currentPage--;
                renderPage(currentPage);
            }
        });

        nextBtn.addEventListener('click', function() {
            if (currentPage < totalPages) {
                currentPage++;
                renderPage(currentPage);
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.target.tagName === 'INPUT') return;
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                if (currentPage > 1) {
                    currentPage--;
                    renderPage(currentPage);
                }
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                if (currentPage < totalPages) {
                    currentPage++;
                    renderPage(currentPage);
                }
            }
        });

    })();
</script>
</body>
</html>
